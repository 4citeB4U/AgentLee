name: LeeWay Pocket Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - pocket-live-leeway-20260928

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pocket branch
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDKROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools-unpacked"
          mv "$RUNNER_TEMP/cmdline-tools-unpacked/cmdline-tools" "$SDKROOT/cmdline-tools/latest"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDKROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDKROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDKROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDKROOT" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: pocket-android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LeeWay-Pocket-Agent-Alpha-APK
          path: pocket-android/app/build/outputs/apk/debug/app-debug.apk
