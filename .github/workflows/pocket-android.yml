name: LeeWay Pocket Android APK

on:
  workflow_dispatch:
  push:
    branches: [leeway-pocket-agent-alpha]
    paths: ['pocket-android/**', '.github/workflows/pocket-android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: pocket-android
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LeeWay-Pocket-Agent-Alpha-APK
          path: pocket-android/app/build/outputs/apk/debug/app-debug.apk
